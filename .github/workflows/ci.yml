name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.1
  PNPM_VERSION: 10.33.2
  RUST_VERSION: 1.97.0
  CARGO_DENY_VERSION: 0.20.2

jobs:
  quality-linux:
    name: Linux quality and runtime smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy,rustfmt
          rustup default "${RUST_VERSION}"

      - name: Install Tauri system dependencies
        run: |
          bash scripts/ci-install-linux-tauri-deps.sh \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev webkit2gtk-driver wget xdg-utils xvfb

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm and Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: m00-jammy-${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock') }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend, Rust and documentation
        run: pnpm check

      - name: Run unit and harness suites
        run: |
          pnpm test:coverage
          pnpm test:render
          pnpm test:perf

      - name: Run Rust tests
        run: |
          cargo test --workspace
          cargo test --workspace --features fake-platform

      - name: Run controlled X11 renderer boundary smoke
        run: xvfb-run --auto-servernum env XDG_SESSION_TYPE=x11 pnpm smoke:m01:x11

      - name: Audit JavaScript dependencies
        run: |
          pnpm audit:licenses
          pnpm audit:security

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-deny --version "=${CARGO_DENY_VERSION}" --locked
          cargo deny check

      - name: Run browser E2E
        run: pnpm test:e2e:browser

      - name: Run real Tauri E2E
        run: xvfb-run --auto-servernum pnpm test:e2e:tauri

      - name: Verify production excludes test drivers
        run: pnpm verify:release-boundary

      - name: Build Ubuntu 22.04 packages and verify ABI
        run: |
          pnpm tauri build --bundles deb,appimage -- --locked
          pnpm check:linux:compat
          target/release/cute-screen --help
          node scripts/check-m04-deb.mjs
          APPIMAGE_EXTRACT_AND_RUN=1 node scripts/check-m04-appimage.mjs

      - name: Upload Linux x64 packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-x64-ubuntu22-${{ github.sha }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload M01 trend and smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m01-linux-evidence-${{ github.run_id }}
          path: |
            artifacts/perf/m01-renderer.json
            artifacts/m01/x11-controlled.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m00-linux-failure-${{ github.run_id }}
          path: |
            artifacts
            coverage
          if-no-files-found: ignore
          retention-days: 14

  compile:
    name: Compile ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            tauri_deps: true
          - name: Windows x64
            os: windows-2025
            tauri_deps: false
          - name: Windows ARM64
            os: windows-11-arm
            tauri_deps: false
          - name: macOS ARM64
            os: macos-15
            tauri_deps: false
          - name: macOS Intel
            os: macos-15-intel
            tauri_deps: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Activate pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy,rustfmt
          rustup default "${RUST_VERSION}"

      - name: Install Linux Tauri dependencies
        if: matrix.tauri_deps
        run: |
          bash scripts/ci-install-linux-tauri-deps.sh \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev wget xdg-utils

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm and Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: m00-compile-${{ matrix.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile frontend and Rust workspace
        run: |
          pnpm build
          cargo check --workspace --all-targets

      - name: Build Ubuntu 22.04 ARM64 packages and verify ABI
        if: matrix.tauri_deps
        run: |
          pnpm tauri build --bundles deb,appimage -- --locked
          pnpm check:linux:compat
          target/release/cute-screen --help
          node scripts/check-m04-deb.mjs
          APPIMAGE_EXTRACT_AND_RUN=1 node scripts/check-m04-appimage.mjs

      - name: Upload Linux ARM64 packages
        if: matrix.tauri_deps
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-arm64-ubuntu22-${{ github.sha }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Syntax-check macOS legacy SDK branch
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: |
          for source in src/macos_window_capture.m src/macos_capture_bridge.m; do
            cc -fsyntax-only -fobjc-arc -Wall -Wextra -Wno-deprecated-declarations \
              -mmacosx-version-min=12.0 -DCUTE_SCREEN_MACOS_SDK=130000 "$source"
          done

      - name: Upload compile logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m00-compile-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts
          if-no-files-found: ignore
          retention-days: 14
