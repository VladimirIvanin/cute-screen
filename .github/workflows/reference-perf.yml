name: Reference performance

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Trusted commit SHA or branch to measure
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cutescreen-reference-performance
  cancel-in-progress: false

jobs:
  reference-perf:
    name: M05 real-Tauri GPU gate
    runs-on: [self-hosted, linux, x64, cutescreen-reference, rtx-2070-super]
    timeout-minutes: 45
    steps:
      - name: Checkout trusted ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run strict reference performance gate
        run: pnpm test:perf:reference

      - name: Upload reference evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m05-reference-perf-${{ github.sha }}
          path: |
            artifacts/reference-perf
          if-no-files-found: warn
          retention-days: 90
