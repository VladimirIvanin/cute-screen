name: Reference performance

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Trusted commit SHA or branch to measure
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cutescreen-reference-performance
  cancel-in-progress: false

jobs:
  reference-perf:
    name: M05 real-Tauri GPU gate
    runs-on: [self-hosted, linux, x64, cutescreen-reference, rtx-2070-super]
    timeout-minutes: 45
    steps:
      - name: Checkout trusted ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644fa41551a30e30af803 # v6
        with:
          node-version: 22.23.1

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run strict reference performance gate
        run: pnpm test:perf:reference

      - name: Upload reference evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m05-reference-perf-${{ github.sha }}
          path: |
            artifacts/reference-perf
          if-no-files-found: warn
          retention-days: 90
