name: Pinned release toolchain
description: Install the repository toolchain and cache only this production target
outputs:
  cache-key:
    description: Primary cache key
    value: ${{ steps.cache.outputs.cache-primary-key }}
  cache-hit:
    description: Exact cache match
    value: ${{ steps.cache.outputs.cache-hit }}
  store:
    description: pnpm store directory
    value: ${{ steps.store.outputs.path }}
inputs:
  image:
    description: Explicit runner image; never share a build cache across Linux baselines
    required: true
  target:
    description: Rust target or universal-apple-darwin
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 22.23.1
    - name: Install pnpm and Rust
      shell: bash
      env:
        RELEASE_TARGET: ${{ inputs.target }}
      run: |
        corepack enable
        corepack prepare pnpm@10.33.2 --activate
        rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
        rustup default 1.97.0
        if [[ "$RELEASE_TARGET" == universal-apple-darwin ]]; then
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
        else
          rustup target add "$RELEASE_TARGET"
        fi
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        bash scripts/ci-install-linux-tauri-deps.sh \
          build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
          libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget xvfb dbus-x11
    - name: Resolve pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: cache
      with:
        path: |
          ${{ steps.store.outputs.path }}
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: release-production-${{ inputs.image }}-${{ runner.arch }}-${{ inputs.target }}-node22.23.1-rust1.97.0-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock') }}
    - name: Install workspace dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
