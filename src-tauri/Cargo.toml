[package]
name = "cute-screen-desktop"
default-run = "cute-screen"
version.workspace = true
description = "Cute Screen desktop host"
authors = ["Cute Screen contributors"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "cute_screen_desktop"
path = "src/lib.rs"

[[bin]]
name = "cute-screen"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
png = "=0.18.1"
futures-util = "=0.3.33"
tauri = { version = "=2.11.5", features = ["protocol-asset", "tray-icon"] }
clap = { version = "=4.6.4", features = ["derive"] }
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-wdio = { version = "=1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }
thiserror = "=2.0.19"
url = "=2.5.8"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "screenshot", "global_shortcuts"] }
tokio = { version = "=1.53.1", features = ["rt", "time"] }
x11rb = { version = "=0.14.0", default-features = false, features = ["image", "randr"], optional = true }

[features]
default = []
fake-platform = []
x11-capture = ["dep:x11rb"]
test-harness = [
  "dep:tauri-plugin-wdio",
  "dep:tauri-plugin-wdio-webdriver",
]
