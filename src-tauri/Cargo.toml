[package]
name = "cute-screen-desktop"
autobins = false
default-run = "cute-screen"
version.workspace = true
description = "Cute Screen desktop host"
authors = ["Cute Screen contributors"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "cute_screen_desktop"
path = "src/lib.rs"

[[bin]]
name = "cute-screen"
path = "src/main.rs"

[[bin]]
name = "m01-platform-smoke"
path = "src/bin/m01-platform-smoke.rs"
required-features = ["platform-smoke"]

[[bin]]
name = "m04-platform-smoke"
path = "src/bin/m04-platform-smoke.rs"
required-features = ["platform-smoke"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
png = "=0.18.1"
# Used only for bounded JPEG header/EXIF inspection.  It is already a
# transitive dependency of arboard; pinning it here makes the import contract
# explicit without enabling its broad default codec set.
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
arboard = { version = "=3.6.1", features = ["wayland-data-control"] }
futures-util = "=0.3.33"
tauri = { version = "=2.11.5", features = ["protocol-asset", "tray-icon"] }
clap = { version = "=4.6.4", features = ["derive"] }
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-wdio = { version = "=1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }
thiserror = "=2.0.19"
url = "=2.5.8"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
uuid = { version = "=1.24.0", features = ["v7", "serde"] }
chrono = "=0.4.45"
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }
tempfile = "=3.27.0"
# CapturePreflightService is shared by every desktop host, not only the Linux
# portal implementation.
tokio = { version = "=1.53.1", features = ["rt", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "screenshot", "global_shortcuts"] }
x11rb = { version = "=0.14.0", default-features = false, features = ["composite", "image", "randr", "xfixes"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
# Compile the pure x11rb adapter and its policy tests on Windows CI too. This
# catches protocol/API drift even when a Linux sysroot is unavailable locally.
x11rb = { version = "=0.14.0", default-features = false, features = ["composite", "image", "randr", "xfixes"] }

[features]
default = ["x11-capture"]
fake-platform = []
platform-smoke = []
x11-capture = ["dep:x11rb"]
test-harness = [
  "dep:tauri-plugin-wdio",
  "dep:tauri-plugin-wdio-webdriver",
]
