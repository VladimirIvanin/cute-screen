[package]
name = "cute-screen-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
png = "=0.18.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rusqlite_migration = "=2.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
ts-rs = "=12.0.1"
tokio = { version = "=1.54.1", features = ["rt", "sync"] }
uuid = { version = "=1.29.0", features = ["v7", "serde"] }
zip = { version = "=9.2.0", default-features = false, features = ["deflate"] }
tempfile = "=3.27.0"
