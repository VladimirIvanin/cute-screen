[package]
name = "cute-screen-portal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "screenshot", "global_shortcuts"] }
futures-util = "=0.3.33"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.3", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "=1.24.0", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "=5.18.0", default-features = false, features = ["tokio"] }
