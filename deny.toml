[graph]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
exceptions = [
  # Required by Tauri 2's tauri-utils DOM-query stack. These are pinned,
  # unmodified upstream crates; MPL is not accepted globally.
  { allow = ["MPL-2.0"], crate = "cssparser@0.36.0" },
  { allow = ["MPL-2.0"], crate = "cssparser-macros@0.6.1" },
  { allow = ["MPL-2.0"], crate = "dtoa-short@0.3.5" },
  { allow = ["MPL-2.0"], crate = "selectors@0.36.1" },
  # Required by Tauri 2 through the dirs crate.
  { allow = ["MPL-2.0"], crate = "option-ext@0.2.0" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
